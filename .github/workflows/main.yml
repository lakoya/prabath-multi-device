name: Prabath-MD 24/7 Runner

on:
  push:
    branches: [ main ]
  schedule:
    # Automatically restarts the bot every 5 hours to prevent GitHub's 6-hour timeout
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install FFmpeg and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg webp
        npm install

    - name: Start Prabath-MD Bot
      env:
        SESSION_ID: "PRABATH-MD~nnBvvJGZIYdYpYR"
        MONGODB_URI: "mongodb://mongo:jkMdMNxdcmmgDSdnWuVpXpYJbOsQKswh@mongodb.railway.internal:27017"
      run: |
        # Runs the bot for 4 hours and 55 minutes before exiting cleanly for the next cron cycle
        timeout 17700s npm start || true
